const EO = { date: null, res: null, busy: false };
async function suggestAfterEatOut(date) {
  if (EO.busy) return;
  EO.busy = true; EO.date = date; EO.res = null;
  openSheet(`<h3>この先の献立を考えています…</h3><ul class="plain prog"><li><span class="dot run"></span><span>外食の内容と、この先${'6'}日の献立を見直しています</span></li></ul>`);
  const day = S.days[date], eo = day.eatOut;
  const next = [...Array(6)].map((_, i) => addDays(date, i + 1)).filter(d => S.days[d]?.dishes?.length && !S.days[d].eatOut);
  const unused = (day.dishes || []).flatMap(x => (x.ing || []).filter(i => i.c !== '調味料' && !i.left).map(i => i.n + ' ' + i.q));
  const p = `家族の${date}(${dowOf(date)})の夕食が、急に外食（${eo.genre}${eo.memo ? '・' + eo.memo : ''}）になりました。予定していた献立は作っていません。
作らなかった献立: ${(day.dishes || []).map(x => x.role + '「' + x.name + '」').join('、') || 'なし'}
そのために買ってあるかもしれない材料: ${unused.join('、') || 'なし'}
この先の献立:
${next.map(d => `- ${d}(${dowOf(d)}): ` + S.days[d].dishes.map(x => x.role + '「' + x.name + '」').join('、')).join('\n') || '- なし'}
${familyText()}
${eventsText(next)}

次の2つのパターンを提案してください。
1. id "keep"（タイトル「そのままでいく」）: この先の献立はできるだけ変えない。作らなかった材料の扱い（翌日以降のどの料理に回すか、冷凍するか）を具体的に書く。changesは空か、作らなかった主菜を傷みやすさに合わせて別の日と入れ替える程度。
2. id "adjust"（タイトル「栄養を整える」）: 外食で偏りやすい栄養（例:焼肉は脂質・塩分が多く野菜が少ない、ラーメンは塩分と炭水化物、ファストフードは脂質）を、この先1〜3日の献立で整える。子どもの年齢別の目安も考える。作らなかった材料も無駄なく使う。変える日だけchangesに入れる（日付はこの先の献立の日付から選ぶ）。
eatOutNutriは外食1食分の大人1人分の栄養推定（ご飯・麺など主食を含む）。
JSONのみ:
{"summary":"外食で多くなりがちな栄養のひとこと(40字以内)","eatOutNutri":{"kcal":900,"protein":35,"fat":45,"carb":90,"veg":60,"salt":5,"note":"…"},"patterns":[{"id":"keep","title":"そのままでいく","desc":"…(60字以内)","ingredients":"作らなかった材料の扱い(60字以内)","changes":[]},{"id":"adjust","title":"栄養を整える","desc":"…(60字以内)","ingredients":"…","changes":[{"date":"YYYY-MM-DD","reason":"変える理由(30字以内)","dishes":[{"role":"主菜","name":"…"},{"role":"副菜","name":"…"},{"role":"汁物","name":"…"}]}]}]}`;
  try {
    const r = await S.sample.json(p, { modelTier: 'default' });
    const pats = (Array.isArray(r?.patterns) ? r.patterns : []).map(x => ({ id: String(x.id || ''), title: String(x.title || ''), desc: String(x.desc || ''), ingredients: String(x.ingredients || ''),
      changes: (Array.isArray(x.changes) ? x.changes : []).filter(c => next.includes(c?.date) && Array.isArray(c.dishes) && c.dishes.length).map(c => ({ date: c.date, reason: String(c.reason || ''), dishes: c.dishes.map(d => ({ role: ROLES.includes(d.role) ? d.role : '副菜', name: String(d.name || '') })).filter(d => d.name) })) })).filter(x => x.title);
    if (!pats.length) throw { code: 'invalid_json' };
    EO.res = { summary: String(r.summary || ''), pats };
    const nn = cleanNutri(r.eatOutNutri);
    if (nn && S.days[date]?.eatOut) { const doc = JSON.parse(JSON.stringify(S.days[date])); doc.eatOut.nutri = nn; await saveDay(date, doc); }
    EO.busy = false; renderEatOutPlans();
  } catch (e) { EO.busy = false; closeSheet(); toast(aiError(e)); }
}
function renderEatOutPlans() {
  const { summary, pats } = EO.res;
  openSheet(`<h3>この先の献立、どうしますか？</h3>
  ${summary ? `<p style="font-size:14px">${esc(summary)}</p>` : ''}
  ${pats.map((pt, i) => `<div class="card plan"><h4>${esc(pt.title)}</h4><p style="font-size:13.5px">${esc(pt.desc)}</p>
    ${pt.ingredients ? `<p class="hint">作らなかった材料：${esc(pt.ingredients)}</p>` : ''}
    ${pt.changes.length ? pt.changes.map(c => `<div class="chg"><span><b>${md(c.date)}（${dowOf(c.date)}）</b> ${esc(c.reason)}</span><span class="struck" style="font-size:12.5px">${esc((S.days[c.date]?.dishes || []).map(x => x.name).join('・'))}</span><span>→ ${esc(c.dishes.map(d => d.name).join('・'))}</span></div>`).join('') : '<p class="hint">この先の献立は変えません。</p>'}
    <button class="btn ${i === 0 ? 'ghost' : ''} block" data-act="eo-apply" data-i="${i}">この案にする</button></div>`).join('')}
  <button class="btn ghost block" data-act="sheet-close">あとで決める</button>`);
}
async function applyEatOutPlan(i) {
  const pt = EO.res?.pats?.[i]; const date = EO.date; if (!pt || !date) return;
  closeSheet();
  if (S.days[date]?.eatOut) { const doc = JSON.parse(JSON.stringify(S.days[date])); doc.eatOut.planTitle = pt.title; await saveDay(date, doc); }
  if (!pt.changes.length) { toast('この先の献立はそのままにしました'); return; }
  toast(`${pt.changes.length}日分の献立を作り直しています…`);
  const unused = (S.days[date]?.dishes || []).flatMap(x => (x.ing || []).filter(r => r.c !== '調味料' && !r.left).map(r => r.n + ' ' + r.q)).join('、');
  let ok = 0;
  for (const c of pt.changes) {
    try {
      const prev = S.days[addDays(c.date, -1)], nxt = S.days[addDays(c.date, 1)];
      const r = await S.sample.json(detailPrompt(c.date, { dishes: c.dishes }, (prev?.carry || []).map(x => x.n + ' ' + x.q).join('、') + (unused ? '、外食で使わなかった材料（' + unused + '）' : ''), (nxt?.uses || []).map(u => u.n + ' ' + u.q).join('、'), `${md(date)}の外食（${S.days[date]?.eatOut?.genre || ''}）のあとの調整: ${c.reason}`), { modelTier: 'default' });
      const doc = cleanDay(c.date, r, null); if (!doc.dishes.length) throw { code: 'invalid_json' };
      await saveDay(c.date, doc); ok++;
    } catch (e) { if (e?.code === 'rate_limited' || e?.code === 'not_granted') { toast(aiError(e)); return; } }
  }
  toast(ok === pt.changes.length ? `${ok}日分の献立を「${pt.title}」に変えました` : `${ok}/${pt.changes.length}日分だけ変えられました。残りは各日の「AIで作り直す」からお試しください`);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'sheet-bg') { if (e.target === t && !S.gen && !IMP.busy && !EO.busy) closeSheet(); return; }
  if (a === 'check') return;
  switch (a) {
    case 'tab': closeSheet(); S.tab = t.dataset.tab; S.day = null; try { localStorage.setItem('kondate.tab', S.tab); } catch (err) {} render(); window.scrollTo(0, 0); break;
    case 'wk': S.week = addDays(S.week, +t.dataset.n); render(); break;
    case 'mo': { const [y, m] = S.month.split('-').map(Number); const d = new Date(y, m - 1 + +t.dataset.n, 1); S.month = ymd(d).slice(0, 7); render(); break; }
    case 'view': S.view = t.dataset.v; if (S.view === 'month') S.month = addDays(S.week, 3).slice(0, 7); else S.week = S.month === TODAY.slice(0, 7) ? mondayOf(new Date()) : mondayOf(parseD(S.month + '-01')); try { localStorage.setItem('kondate.view', S.view); } catch (err) {} render(); window.scrollTo(0, 0); break;
    case 'open': S.day = t.dataset.date; S.dayTab = 'all'; S.dish = 0; render(); break;
    case 'close-day': S.day = null; render(); break;
    case 'daytab': S.dayTab = t.dataset.t; renderOverlay(); document.querySelector('.overlay').scrollTop = 0; break;
    case 'dish-pick': S.dish = +t.dataset.i; renderOverlay(); break;
    case 'goto-dish': S.dish = +t.dataset.i; S.dayTab = 'dish'; renderOverlay(); document.querySelector('.overlay').scrollTop = 0; break;
    case 'dish-edit': sheetDish(+t.dataset.i); break;
    case 'dish-del': { const doc = JSON.parse(JSON.stringify(S.days[S.day])); doc.dishes.splice(+t.dataset.i, 1); S.dish = 0; saveDay(S.day, doc); closeSheet(); break; }
    case 'del-day': openSheet(`<h3>${md(S.day)}の献立を空にしますか？</h3><p class="hint">この日の料理・段取りが消えます。予定は残ります。</p><button class="btn danger block" data-act="del-day-ok">空にする</button><button class="btn ghost block" data-act="sheet-close">やめる</button>`); break;
    case 'del-day-ok': deleteDay(S.day); closeSheet(); break;
    case 'sheet-close': closeSheet(); break;
    case 'regen-day': if (S.days[S.day]) sheetRegen(); else regenDay(''); break;
    case 'swap-open': sheetSwap(+t.dataset.i); break;
    case 'gen-open': sheetGen(); break;
    case 'ev-add': sheetEvent(t.dataset.date); break;
    case 'ev-del': {
      const date = t.dataset.date;
      if (t.dataset.rid) { const r = S.recurring[t.dataset.rid]; if (!r) break;
        openSheet(`<h3>毎週の予定「${esc(r.kind)}」</h3><p class="hint">${esc(memberName(r.who) || '家族')}・毎週${esc(dowsLabel(r.dows))}</p>
          <button class="btn block" data-act="rep-skip" data-rid="${esc(r.id)}" data-date="${date}">${md(date)}（${dowOf(date)}）だけ休み</button>
          <button class="btn danger block" data-act="rep-del-ok" data-rid="${esc(r.id)}">毎週の予定をやめる</button>
          <button class="btn ghost block" data-act="sheet-close">やめる</button>`); break; }
      const d = S.events[date]; d.items.splice(+t.dataset.i, 1); saveEvents(date); break; }
    case 'rep-skip': { const r = S.recurring[t.dataset.rid]; if (!r) break; r.skip = [...new Set([...(r.skip || []), t.dataset.date])]; render(); put('recurring/' + r.id, r); closeSheet(); toast(md(t.dataset.date) + 'だけ休みにしました'); break; }
    case 'rep-del': { const r = S.recurring[t.dataset.rid]; if (!r) break; openSheet(`<h3>「${esc(r.kind)}」の毎週の予定をやめますか？</h3><p class="hint">${esc(memberName(r.who) || '家族')}・毎週${esc(dowsLabel(r.dows))}。過去と今後のすべての週から消えます。</p><button class="btn danger block" data-act="rep-del-ok" data-rid="${esc(r.id)}">やめる</button><button class="btn ghost block" data-act="sheet-close">残す</button>`); break; }
    case 'rep-del-ok': { const id = t.dataset.rid; delete S.recurring[id]; render(); closeSheet(); if (S.db) S.db.doc('recurring/' + id).delete().catch(() => toast('削除できませんでした')); break; }
    case 'mem-edit': sheetMember(t.dataset.id); break;
    case 'mem-del': S.family.members = S.family.members.filter(m => m.id !== t.dataset.id); saveFamily(); closeSheet(); break;
    case 'copy-shop': copyShop(); break;
    case 'nutri-calc': calcNutri([S.day]); break;
    case 'nut-who': S.nutWho = t.dataset.id; try { localStorage.setItem('kondate.nutWho', S.nutWho); } catch (err) {} render(); break;
    case 'eo-open': sheetEatOut(S.day); break;
    case 'eo-suggest': suggestAfterEatOut(S.day); break;
    case 'eo-apply': applyEatOutPlan(+t.dataset.i); break;
    case 'eo-undo': { const doc = JSON.parse(JSON.stringify(S.days[S.day])); delete doc.eatOut; saveDay(S.day, doc); toast('外食を取り消しました'); break; }
    case 'nutri-week': calcNutri(weekDates().filter(d => !S.days[d]?.nutri)); break;
    case 'imp-open': if (IMP.rows && t.closest('#imp-save')) IMP.rows = null; sheetImport(); break;
    case 'imp-row-del': { const f = document.getElementById('imp-save'); if (f) { const fd = new FormData(f); IMP.rows.forEach((r, i) => r.menu = String(fd.get('m' + i) || '').trim()); } IMP.rows.splice(+t.dataset.i, 1); renderImport(); break; }
    case 'imp-del': { const id = t.dataset.id, d = S.kidmenus[id]; openSheet(`<h3>${esc(memberName(d?.who) || '子ども')}の${esc(monthLabel(d?.month))}の${esc(d?.source || '給食')}を消しますか？</h3><button class="btn danger block" data-act="imp-del-ok" data-id="${esc(id)}">消す</button><button class="btn ghost block" data-act="sheet-close">やめる</button>`); break; }
    case 'imp-del-ok': { const id = t.dataset.id; delete S.kidmenus[id]; render(); closeSheet(); if (S.db) S.db.doc('kidmenus/' + id).delete().catch(() => toast('削除できませんでした')); break; }
  }
});
document.addEventListener('change', e => {
  const t = e.target; if (t.dataset?.act !== 'check') return;
  const c = { ...(S.checks[S.week] || {}) }; if (t.checked) c[t.dataset.name] = true; else delete c[t.dataset.name];
  S.checks[S.week] = c; saveChecks();
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'prefs') return;
  e.preventDefault(); const f = new FormData(e.target);
  S.family.prefs = { time: f.get('time'), focus: f.getAll('focus'), notes: String(f.get('notes') || '').trim() };
  saveFamily(); toast('方針を保存しました');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (document.getElementById('sheet-root').innerHTML && !S.gen) closeSheet(); else if (S.day) { S.day = null; render(); } } });
document.addEventListener('pointerover', e => {
  const t = e.target.closest?.('[data-tip]'); document.querySelector('.tip-pop')?.remove();
  if (!t || e.pointerType !== 'mouse') return;
  const r = t.getBoundingClientRect(), d = document.createElement('div'); d.className = 'tip-pop'; d.textContent = t.dataset.tip;
  document.body.appendChild(d); const w = d.offsetWidth;
  d.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px'; d.style.top = (r.top - 34) + 'px';
});
function copyShop() {
  const list = shoppingList(); const checks = S.checks[S.week] || {};
  const txt = `買い物リスト ${md(S.week)}〜${md(addDays(S.week, 6))}\n` + CATS.filter(c => c !== '調味料').map(cat => {
    const its = list.filter(i => i.cat === cat && !checks[i.name]); return its.length ? `【${cat}】\n` + its.map(i => `・${i.name} ${i.qty}`).join('\n') : '';
  }).filter(Boolean).join('\n');
  navigator.clipboard.writeText(txt).then(() => toast('コピーしました。LINEなどに貼り付けできます'), () => {
    openSheet(`<h3>買い物リスト</h3><textarea class="inp" id="copy-area" rows="12" readonly>${esc(txt)}</textarea><p class="hint">長押しで全選択してコピーしてください。</p>`, el => el.querySelector('textarea').select());
  });
}

boot();
</script>
